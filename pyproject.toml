[project]
name = "spec2behavior"
version = "0.1.0"
description = "Synthesize training data and fine-tune models from written behavioral specifications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["tinker-cookbook>=0.5"]

[project.scripts]
spec2behavior-synthesize = "synthesis.cli:main"
spec2behavior-train = "training.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["synthesis*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
